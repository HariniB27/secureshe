{% extends "admin/base.html" %}
{% block title %}Admin sign in{% endblock %}
{% block body %}
<div class="panel login">
  <h1>Admin sign in</h1>
  <p style="color:var(--muted)">Enter the admin key. Sessions last 30 minutes.</p>
  <form method="post" action="{{ url_for('admin.login') }}" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="key">Admin key</label>
    <input id="key" name="key" type="password" autocomplete="off" required autofocus>
    <p><button type="submit">Sign in</button></p>
  </form>
</div>
{% endblock %}
