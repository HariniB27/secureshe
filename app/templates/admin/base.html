<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}SecureShe admin{% endblock %}</title>
<style nonce="{{ nonce }}">
  :root { --navy:#0b1730; --navy2:#13244a; --coral:#ff6b5e; --ink:#1b2438; --muted:#6a7488; --line:#e3e7ef; --bg:#f4f6fb; --ok:#1c8a5a; --warn:#b7791f; --bad:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--navy); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header .brand { font-weight:700; letter-spacing:.3px; }
  header .brand b { color:var(--coral); }
  header nav { display:flex; gap:14px; flex:1; }
  header a { color:#cfd8ee; text-decoration:none; } header a:hover { color:#fff; }
  header form { margin:0; }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 14px; } h2 { font-size:17px; margin:22px 0 8px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .card .n { font-size:26px; font-weight:700; color:var(--navy); } .card .l { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; background:#fff; border:1px solid var(--line); border-radius:10px; }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; font-size:14px; }
  th { background:#eef1f8; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
  tr:last-child td { border-bottom:0; }
  a { color:#c4372b; } a.id { font-family:ui-monospace,Menlo,monospace; font-weight:600; }
  .pill { display:inline-block; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:600; background:#e9edf7; color:var(--navy2); }
  .pill.confirmed,.pill.RESOLVED { background:#dff3ea; color:var(--ok); } .pill.pending { background:#fdf0d5; color:var(--warn); } .pill.failed { background:#fbe0dc; color:var(--bad); }
  .flash { padding:10px 14px; border-radius:8px; margin:0 0 12px; } .flash.ok { background:#dff3ea; color:#145c3c; } .flash.error { background:#fbe0dc; color:#8e2a1f; }
  label { display:block; font-weight:600; margin:10px 0 4px; }
  input[type=password], input[type=text] { width:100%; padding:10px 12px; border:1px solid #c9d0de; border-radius:8px; font-size:16px; }
  button { background:var(--coral); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-size:15px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:#cfd8ee; border:1px solid #3b4d7a; padding:6px 12px; }
  button.secondary { background:var(--navy2); }
  .grid2 { display:grid; grid-template-columns:160px 1fr; gap:6px 14px; } .grid2 dt { color:var(--muted); } .grid2 dd { margin:0; word-break:break-word; }
  .mono { font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  ol.timeline { list-style:none; margin:0; padding:0; } ol.timeline li { padding:6px 0 6px 26px; position:relative; color:var(--muted); }
  ol.timeline li::before { content:""; position:absolute; left:4px; top:11px; width:12px; height:12px; border-radius:50%; border:2px solid #c3cada; background:#fff; }
  ol.timeline li.done { color:var(--ink); } ol.timeline li.done::before { background:var(--ok); border-color:var(--ok); }
  ol.timeline li.current { color:var(--navy); font-weight:700; } ol.timeline li.current::before { background:var(--coral); border-color:var(--coral); }
  .pager { display:flex; gap:12px; align-items:center; margin:12px 0; color:var(--muted); }
  .login { max-width:380px; margin:60px auto; }
  @media (max-width:560px) { .grid2 { grid-template-columns:1fr; } .grid2 dt { margin-top:8px; } }
</style>
</head>
<body>
{% if admin_logged_in %}
<header>
  <span class="brand">Secure<b>She</b> admin</span>
  <nav><a href="{{ url_for('admin.dashboard') }}">Dashboard</a><a href="{{ url_for('admin.reports') }}">All reports</a></nav>
  <form method="post" action="{{ url_for('admin.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="ghost" type="submit">Log out</button></form>
</header>
{% endif %}
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
